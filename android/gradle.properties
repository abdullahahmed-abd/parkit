# ============================================
# GRADLE PROPERTIES - LOW MEMORY BUILD
# ============================================

# Memory Settings (Reduced for stability)
org.gradle.jvmargs=-Xmx1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Disable Gradle Daemon (saves memory)
org.gradle.daemon=false

# Disable Parallel Builds (saves memory)
org.gradle.parallel=false

# Disable Caching (prevents corruption)
org.gradle.caching=false

# Disable Configure on Demand
org.gradle.configureondemand=false


# ============================================
# ANDROID SETTINGS
# ============================================

android.useAndroidX=true
android.enableJetifier=true

# Disable build cache
android.enableBuildCache=false


# ============================================
# REACT NATIVE SETTINGS
# ============================================

# Single architecture only (saves memory & time)
reactNativeArchitectures=armeabi-v7a

# Disable New Architecture
newArchEnabled=false

# Enable Hermes
hermesEnabled=true


# ============================================
# RELEASE SIGNING CONFIG
# ============================================

MYAPP_UPLOAD_STORE_FILE=my-release-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=my-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=sundukpay
MYAPP_UPLOAD_KEY_PASSWORD=sundukpay
