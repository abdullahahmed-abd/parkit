# ============================================
# GRADLE PROPERTIES - 8GB RAM OPTIMIZED
# ============================================

# --------------------------------------------
# GRADLE MEMORY SETTINGS
# --------------------------------------------
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable daemon
org.gradle.daemon=true

# Disable parallel (saves RAM on 8GB systems)
org.gradle.parallel=false

# Enable caching
org.gradle.caching=true

# Enable configure on demand
org.gradle.configureondemand=true


# ============================================
# ANDROID SETTINGS
# ============================================

android.useAndroidX=true
android.enableJetifier=true

# ✅ Suppress SDK warnings
android.suppressUnsupportedCompileSdk=36

# ✅ Non-transitive R classes
android.nonTransitiveRClass=true


# ============================================
# REACT NATIVE SETTINGS
# ============================================

reactNativeArchitectures=armeabi-v7a,arm64-v8a
newArchEnabled=false
hermesEnabled=true


# ============================================
# KOTLIN SETTINGS
# ============================================

kotlin.jvm.target.validation.mode=warning
kotlin.code.style=official


# ============================================
# RELEASE SIGNING CONFIG
# ============================================

MYAPP_UPLOAD_STORE_FILE=my-release-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=my-key-alias
MYAPP_UPLOAD_STORE_PASSWORD=sundukpay
MYAPP_UPLOAD_KEY_PASSWORD=sundukpay